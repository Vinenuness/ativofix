<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtivoFix — Entrar</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=20260921b" />
  <link rel="icon" href="/static/favicon.ico?v=20260921b" sizes="any" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=20260921b" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #101418;
      --border: #29313a;
      --border-strong: #39434e;
      --text: #e9edf0;
      --muted: #8f9aa4;
      --faint: #5c6670;
      --steel: #4db5f5;
    }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }
    /* brilho azul suave atrás do card */
    body::before {
      content: "";
      position: absolute; inset: 0;
      background:
        radial-gradient(720px 420px at 50% 36%, rgba(56,189,248,0.07), transparent 65%),
        radial-gradient(560px 340px at 85% 110%, rgba(56,189,248,0.05), transparent 60%);
      pointer-events: none;
    }

    /* ---------- Marca d'água: chip gigante fantasma ---------- */
    .wm {
      position: fixed; inset: 0;
      pointer-events: none;
      overflow: hidden;
      user-select: none;
    }
    .wm img {
      position: absolute;
      right: -14vmin; bottom: -16vmin;
      width: 82vmin; height: 82vmin;
      opacity: 0.05;
      transform: rotate(-8deg);
    }
    .wm img.sm {
      left: -10vmin; top: -12vmin; right: auto; bottom: auto;
      width: 46vmin; height: 46vmin;
      opacity: 0.035;
      transform: rotate(6deg);
    }

    /* ---------- Lockup mínimo no topo ---------- */
    .corner-logo {
      position: fixed; top: 26px; left: 30px;
      z-index: 2;
    }
    .corner-logo img { height: 34px; width: auto; display: block; opacity: 0.92; }

    /* ---------- Card central ---------- */
    .card {
      position: relative; z-index: 1;
      width: min(412px, 94vw);
      background: rgba(22, 27, 32, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 34px 28px;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.45);
    }
    .card-head { text-align: center; margin-bottom: 26px; }
    .card-head .chip {
      width: 46px; height: 46px;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: #1d242a;
      border: 1px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
    }
    .card-head .chip img { width: 30px; height: 30px; }
    .card-head h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.4px; }
    .card-head p { margin-top: 5px; font-size: 13px; color: var(--muted); }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: #aab4bd;
      margin-bottom: 7px;
      letter-spacing: 0.3px;
    }
    .field .in { position: relative; }
    .field .in svg {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      width: 17px; height: 17px; color: var(--faint); pointer-events: none;
    }
    .field input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: #141920;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field input::placeholder { color: var(--faint); }
    .field input:focus {
      outline: none;
      border-color: #2c6a94;
      box-shadow: 0 0 0 3px rgba(56,189,248,0.14);
    }

    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #f2f4f5;
      color: #15191d;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s ease, box-shadow .15s ease;
    }
    .submit-btn:hover { background: #ffffff; box-shadow: 0 2px 12px rgba(0,0,0,0.35); }
    .submit-btn:active { background: #dde2e6; }

    .aux-row {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--faint);
    }
    .aux-row a { color: var(--steel); text-decoration: none; font-weight: 500; }
    .aux-row a:hover { text-decoration: underline; }

    .error-msg {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 9px;
      border: 1px solid rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.08);
      color: #f5b0b0;
      font-size: 13px;
      text-align: center;
    }

    .portal-hint {
      margin-top: 22px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px dashed var(--border-strong);
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.55;
      text-align: center;
    }
    .portal-hint a { color: var(--steel); font-weight: 600; text-decoration: none; }
    .portal-hint a:hover { text-decoration: underline; }

    .foot {
      position: fixed; bottom: 18px; left: 0; right: 0;
      text-align: center;
      font-size: 11.5px;
      color: #454e57;
      z-index: 2;
    }
    .foot a { color: #5c6670; text-decoration: none; }
    .foot a:hover { color: var(--steel); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wm" aria-hidden="true">
    <img src="/static/logo-icon.png?v=20260921b" alt="" />
    <img src="/static/logo-icon.png?v=20260921b" alt="" class="sm" />
  </div>

  <div class="corner-logo">
    <img src="/static/logo.png?v=20260921b" alt="AtivoFix — Tecnologia em Movimento" />
  </div>

  <main class="card">
    <div class="card-head">
      <div class="chip"><img src="/static/logo-icon.png?v=20260921b" alt="" /></div>
      <h1>Acessar o painel</h1>
      <p>Entre com suas credenciais para continuar</p>
    </div>

    <form method="POST" action="/login2">
      <div class="field">
        <label>Usuário ou e-mail</label>
        <div class="in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input name="username" type="text" placeholder="seu.usuario" required autocomplete="username" />
        </div>
      </div>
      <div class="field">
        <label>Senha</label>
        <div class="in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input name="password" type="password" placeholder="Digite sua senha" required autocomplete="current-password" />
        </div>
      </div>
      <button type="submit" class="submit-btn">Entrar</button>
    </form>

    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}

    <div class="aux-row"><a href="/forgot-password">Esqueci minha senha</a></div>

    <div class="portal-hint">
      Precisa abrir uma solicitação?<br />
      Use o <a href="/abrir-chamado">Portal do Usuário</a> — sem login.
    </div>
  </main>

  <div class="foot">
    AtivoFix — Tecnologia em Movimento &nbsp;·&nbsp; <a href="/login">ver estilo split-screen</a>
  </div>
</body>
</html>
