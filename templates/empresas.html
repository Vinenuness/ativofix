<!DOCTYPE html><html><head><meta charset="UTF-8" /><title>Empresas - AtivoFix</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=20260921b" />
  <link rel="icon" href="/static/favicon.ico?v=20260921b" sizes="any" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=20260921b" />
  <link rel="stylesheet" href="/static/brand.css?v=20260921b" /><style>body{font-family:Arial;background:#1b2024;color:#e4e8ea;margin:0;padding:20px}
h1{margin:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.left{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input,select,textarea{padding:10px 12px;border-radius:10px;border:1px solid #313a41;background:#12161a;color:#e4e8ea;outline:none}
textarea{min-height:80px;resize:vertical}
.btn{border:1px solid #313a41;background:#12161a;color:#e4e8ea;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:12px}
.btn:hover{background:#1c2226}
.btn-primary{background:#0d9488;border-color:#0d9488}
.btn-primary:hover{background:#0f766e}
.btn-danger{border-color:#ef4444;color:#ef4444}
.btn-danger:hover{background:#ef4444;color:#fff}
a{color:#e4e8ea;text-decoration:none}
.small{font-size:12px;color:#a5adb3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:#232a30;border:1px solid #313a41;border-radius:14px;padding:14px}
.card:hover{transform:translateY(-2px);background:#262e34;transition:all .2s}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.title{font-weight:800;color:#fff;font-size:16px}
.muted{color:#a5adb3;font-size:13px;margin-top:4px;line-height:1.35}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modalBox{width:100%;max-width:520px;background:#1d2328;border:1px solid #313a41;border-radius:16px;padding:24px 28px}
.modalTitle{font-weight:800;margin:0 0 18px 0;font-size:20px;color:#fff}
.modalActions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #232a30}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;color:#a5adb3;font-weight:500}
.form-group input,.form-group textarea{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #313a41;background:#12161a;color:#e4e8ea;font-size:14px}
.form-group input:focus,.form-group textarea:focus{border-color:#0d9488;outline:none}</style></head><body><div class=top><div class=left><div class="brand-icon" style="background:#293237;display:flex;align-items:center;justify-content:center;padding:4px;flex-shrink:0;width:34px;height:34px;border-radius:9px"><img src="/static/logo-icon.png?v=20260921b" alt="AtivoFix" style="width:100%;height:100%;object-fit:contain" /></div><a href=/>&#8592; Voltar</a><h1>Empresas</h1><div class=small id=count></div></div>
<button class="btn btn-primary" onclick="openCreateModal()">+ Nova Empresa</button></div>
<div id=grid class=grid></div>
<div id=orphanBox style="display:none;margin-top:22px;background:#232a30;border:1px solid #4a3b1e;border-radius:14px;padding:16px">
  <div style="font-weight:800;color:#fbbf24;font-size:15px;margin-bottom:4px">&#9888; PCs aguardando vínculo</div>
  <div class=small style="margin-bottom:10px">Máquinas que reportaram inventário mas ainda não pertencem a nenhuma empresa/unidade. Vincule para que apareçam no painel.</div>
  <div id=orphanList></div>
</div>
<div id=modal class=modal onclick="hideModal()"><div class=modalBox onclick="event.stopPropagation()">
<h3 class=modalTitle id=modalTitle>Nova Empresa</h3>
<div class=form-group><label>Nome *</label><input id=tenantName placeholder="Ex: Hospital Sao Lucas" /></div>
<div class=form-group><label>Slug (URL) *</label><input id=tenantSlug placeholder="Ex: hospital-sao-lucas" /></div>
<div class=form-group><label>Descricao</label><textarea id=tenantDesc placeholder="Descricao da empresa..."></textarea></div>
<div class=modalActions><button class=btn onclick="hideModal()">Cancelar</button><button class="btn btn-primary" onclick="saveTenant()">Salvar</button></div>
</div></div><script>var tenants=[],editingId=null;
async function load(){var r=await fetch("/api/tenants");tenants=await r.json();render();}
function render(){
  var g=document.getElementById("grid");g.innerHTML="";
  document.getElementById("count").innerText=tenants.length+" empresas";
  if(!tenants.length){var m=document.createElement("div");m.className="muted";m.textContent="Nenhuma empresa cadastrada.";g.appendChild(m);return;}
  for(var i=0;i<tenants.length;i++){
    var t=tenants[i];var card=document.createElement("div");card.className="card";
    var row=document.createElement("div");row.className="row";
    var left=document.createElement("div");
    var title=document.createElement("div");title.className="title";title.textContent=t.name;left.appendChild(title);
    var slug=document.createElement("div");slug.className="muted";slug.textContent="Slug: "+t.slug;left.appendChild(slug);
    if(t.description){var desc=document.createElement("div");desc.className="muted";desc.textContent=t.description;left.appendChild(desc);}
    row.appendChild(left);
    var right=document.createElement("div");right.style.cssText="display:flex;gap:6px";
    var eb=document.createElement("button");eb.className="btn";eb.textContent="Editar";(function(x){eb.onclick=function(){openEditModal(x);};})(i);right.appendChild(eb);
    if(t.tenant_id!=1){var db=document.createElement("button");db.className="btn btn-danger";db.textContent="Excluir";(function(id){db.onclick=function(){deleteTenant(id);};})(t.tenant_id);right.appendChild(db);}
    row.appendChild(right);card.appendChild(row);g.appendChild(card);
  }
}
function openCreateModal(){editingId=null;document.getElementById("modalTitle").innerText="Nova Empresa";document.getElementById("tenantName").value="";document.getElementById("tenantSlug").value="";document.getElementById("tenantDesc").value="";document.getElementById("modal").style.display="flex";}
function openEditModal(idx){var t=tenants[idx];editingId=t.tenant_id;document.getElementById("modalTitle").innerText="Editar Empresa";document.getElementById("tenantName").value=t.name;document.getElementById("tenantSlug").value=t.slug;document.getElementById("tenantDesc").value=t.description||"";document.getElementById("modal").style.display="flex";}
function hideModal(){document.getElementById("modal").style.display="none";}
async function saveTenant(){
  var n=document.getElementById("tenantName").value.trim();var s=document.getElementById("tenantSlug").value.trim();var d=document.getElementById("tenantDesc").value.trim();
  if(!n||!s){alert("Nome e slug sao obrigatorios");return;}
  var url="/api/tenants";if(editingId)url+="/"+editingId;
  var r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,slug:s,description:d})});
  if(!r.ok){var e=await r.json();alert(e.error||"Erro");return;}
  hideModal();await load();
}
async function deleteTenant(id){if(!confirm("Excluir empresa?"))return;await fetch("/api/tenants/"+id,{method:"DELETE"});await load();}
load();</script><script>
var orphans=[],orphanUnits=[];
async function loadOrphans(){
  try{
    var ro=await fetch("/api/computers/orphans");var jo=await ro.json();orphans=(jo&&jo.computers)||[];
    var ru=await fetch("/api/me");var mu=await ru.json();orphanUnits=(mu&&mu.units)||[];
  }catch(e){orphans=[];orphanUnits=[];}
  renderOrphans();
}
function renderOrphans(){
  var box=document.getElementById("orphanBox");if(!box)return;
  if(!orphans.length){box.style.display="none";return;}
  box.style.display="block";
  var list=document.getElementById("orphanList");list.innerHTML="";
  for(var i=0;i<orphans.length;i++){
    (function(pc){
      var row=document.createElement("div");row.style.cssText="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #2a3238";
      var info=document.createElement("div");
      var nm=document.createElement("div");nm.style.cssText="font-weight:700;color:#fff;font-size:14px";nm.textContent=pc.hostname||"(sem nome)";info.appendChild(nm);
      var meta=document.createElement("div");meta.className="muted";meta.textContent="TAG: "+(pc.tag_evo||"-")+" \u00b7 \u00faltimo reporte: "+(pc.last_seen||"-").replace("T"," ").slice(0,16);info.appendChild(meta);
      row.appendChild(info);
      var right=document.createElement("div");right.style.cssText="display:flex;gap:8px;align-items:center";
      var sel=document.createElement("select");sel.style.cssText="padding:8px 10px;border-radius:10px;border:1px solid #313a41;background:#12161a;color:#e4e8ea;min-width:170px";
      var opt0=document.createElement("option");opt0.value="";opt0.textContent="Vincular \u00e0 unidade...";sel.appendChild(opt0);
      for(var j=0;j<orphanUnits.length;j++){var op=document.createElement("option");op.value=orphanUnits[j].unit_id;op.textContent=orphanUnits[j].name;sel.appendChild(op);}
      right.appendChild(sel);
      var bt=document.createElement("button");bt.className="btn btn-primary";bt.textContent="Vincular";bt.disabled=true;
      sel.onchange=function(){bt.disabled=!sel.value;};
      bt.onclick=async function(){
        if(!sel.value)return;
        bt.disabled=true;bt.textContent="Vinculando...";
        var r=await fetch("/api/computers/"+pc.agent_id+"/unit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({unit_id:parseInt(sel.value,10)})});
        if(!r.ok){var e=await r.json().catch(function(){return{}});alert(e.error||"Erro ao vincular");bt.disabled=false;bt.textContent="Vincular";return;}
        await loadOrphans();
      };
      right.appendChild(bt);
      row.appendChild(right);
      list.appendChild(row);
    })(orphans[i]);
  }
}
loadOrphans();
</script><script>
fetch('/api/me').then(function(r){return r.json()}).then(function(m){if(m.role==='tech'){var sel=document.querySelectorAll('a[href="/usuarios"],a[href="/empresas"],a[href="/estrutura"]');for(var i=0;i<sel.length;i++){sel[i].style.display='none';}if(!m.can_manage_scripts){var sh=document.querySelector('a[href="/scripts"]');if(sh)sh.style.display='none';}}}).catch(function(){});
</script>
</body></html>
