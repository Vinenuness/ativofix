<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Acompanhar Chamado - AtivoFix</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=20260921b" />
  <link rel="icon" href="/static/favicon.ico?v=20260921b" sizes="any" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=20260921b" /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,-apple-system,sans-serif;background:#16191d;color:#e4e8ea;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.container{width:100%;max-width:600px}.header{text-align:center;margin-bottom:32px}.logo{width:56px;height:56px;background:linear-gradient(135deg,#2dd4bf,#2dd4bf);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}.logo svg{width:30px;height:30px;color:white}.brand{font-size:28px;font-weight:800;background:linear-gradient(135deg,#2dd4bf,#2dd4bf);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.subtitle{font-size:14px;color:#8b949b;margin-top:4px}.card{background:rgba(22,26,30,.95);backdrop-filter:blur(20px);border:1px solid rgba(49,58,65,.4);border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.4)}.card h2{font-size:20px;font-weight:700;color:#f2f4f5;margin-bottom:4px}.card p{font-size:13px;color:#8b949b;margin-bottom:24px}.form-group{margin-bottom:18px}.form-group label{display:block;font-size:12px;font-weight:600;color:#a5adb3;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}.form-group input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(49,58,65,.4);background:rgba(35,42,48,.5);color:#e4e8ea;font-size:14px;font-family:inherit;transition:all .2s}.form-group input:focus{outline:none;border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.15)}.form-group input::placeholder{color:#3d474e}.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#2dd4bf,#14b8a6);color:white;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(45,212,191,.3)}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(45,212,191,.4)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.results{margin-top:24px}.ticket-item{background:rgba(35,42,48,.5);border:1px solid rgba(49,58,65,.3);border-radius:12px;padding:16px;margin-bottom:12px;transition:all .2s}.ticket-item:hover{border-color:rgba(45,212,191,.3)}.ticket-title{font-size:14px;font-weight:700;color:#e4e8ea;margin-bottom:6px}.ticket-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.ticket-desc{font-size:12px;color:#a5adb3;line-height:1.5;margin-bottom:8px}.ticket-dates{font-size:11px;color:#8b949b}.badge{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;display:inline-block}.badge-open{background:rgba(45,212,191,.15);color:#2dd4bf}.badge-in_progress{background:rgba(250,204,21,.15);color:#facc15}.badge-resolved{background:rgba(34,197,94,.15);color:#22c55e}.badge-closed{background:rgba(165,173,179,.15);color:#a5adb3}.badge-low{background:rgba(34,197,94,.1);color:#4ade80}.badge-medium{background:rgba(250,204,21,.1);color:#facc15}.badge-high{background:rgba(251,146,60,.1);color:#fb923c}.badge-critical{background:rgba(239,68,68,.15);color:#f87171}.resolution-box{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12px}.resolution-box strong{color:#4ade80}.empty{text-align:center;padding:40px 20px;color:#8b949b}.empty h3{font-size:16px;color:#a5adb3;margin-bottom:8px}.footer{text-align:center;margin-top:24px;font-size:12px;color:#3d474e}.links{text-align:center;margin-top:16px;font-size:13px}.links a{color:#2dd4bf;text-decoration:none}.links a:hover{text-decoration:underline}@media(max-width:480px){.card{padding:24px 20px}}</style></head><body><div class="container"><div class="header"><div class="logo"><img src="/static/logo-icon.png?v=20260921b" alt="AtivoFix" style="width:100%;height:100%;object-fit:cover;border-radius:12px" />
  <link rel="stylesheet" href="/static/brand.css?v=20260921b" /></div><div class="brand">AtivoFix</div><div class="subtitle">Acompanhar Chamado</div></div><div class="card" id="searchCard"><h2>Buscar Chamados</h2><p>Digite o email que voce usou ao abrir o chamado</p><div class="form-group"><label>Email</label><input type="email" id="fEmail" placeholder="Ex: joao@empresa.com"></div><button class="btn" onclick="trackTickets()" id="btnSearch">Buscar Chamados</button></div><div class="card" id="resultsCard" style="display:none"><h2>Seus Chamados</h2><p id="resultsEmail"></p><div class="results" id="resultsList"></div><button class="btn" style="background:linear-gradient(135deg,#2dd4bf,#14b8a6);margin-top:16px" onclick="showSearch()">Buscar Outro Email</button></div><div class="footer">AtivoFix v2.0 - Gestao Inteligente de Inventario</div><div class="links"><a href="/abrir-chamado">Abrir Chamado</a> | <a href="/base-conhecimento">Base de Conhecimento</a> | <a href="/avaliar">Avaliar Atendimento</a> | <a href="/login">Area Administrativa</a></div></div><script>var SL={open:"Aberto",in_progress:"Em Andamento",resolved:"Resolvido",closed:"Fechado"};var PL={low:"Baixa",medium:"Media",high:"Alta",critical:"Critica"};function fmtD(s){if(!s)return"";try{var d=new Date(s);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}catch(e){return s}}function trackTickets(){var email=document.getElementById("fEmail").value.trim();if(!email){alert("Digite seu email");return}var btn=document.getElementById("btnSearch");btn.disabled=true;btn.textContent="Buscando...";fetch("/api/tickets/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email})}).then(function(r){return r.json()}).then(function(d){document.getElementById("searchCard").style.display="none";document.getElementById("resultsCard").style.display="block";document.getElementById("resultsEmail").textContent="Resultados para: "+d.email;var el=document.getElementById("resultsList");if(!d.tickets.length){el.innerHTML="<div class="empty"><h3>Nenhum chamado encontrado</h3><p>Verifique se digitou o email correto</p></div>";return}var h="";d.tickets.forEach(function(t){h+="<div class="ticket-item"><div class="ticket-title">#"+t.ticket_id+" - "+t.title+"</div><div class="ticket-meta"><span class="badge badge-"+t.status+">"+SL[t.status]+"</span><span class="badge badge-"+t.priority+">"+PL[t.priority]+"</span></div>";if(t.description)h+="<div class="ticket-desc">"+t.description+"</div>";if(t.resolution_notes)h+="<div class="resolution-box"><strong>Resolucao:</strong> "+t.resolution_notes+"</div>";if(t.attachments&&t.attachments.length){h+='<div style='margin:8px 0'>';t.attachments.forEach(function(a){var sz=a.size>1048576?(a.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(a.size/1024))+' KB';h+='<div><a href="'+a.url+" style="color:#2dd4bf;text-decoration:none;font-size:13px">Anexo: '+a.filename+' ('+sz+')</a></div>'});h+='</div>'}h+="<div class="ticket-dates">Criado: "+fmtD(t.created_at)+"</div>";if(t.resolved_at)h+="<div class="ticket-dates">Resolvido: "+fmtD(t.resolved_at)+"</div>";if((t.status=="resolved"||t.status=="closed")&&!t.rating){h+='<div class="rateBox" id="rate-'+t.ticket_id+'" style="margin-top:10px;padding:10px 12px;background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.25);border-radius:10px">'+'<div style="font-size:12px;color:#c6cdd2;margin-bottom:6px">Como foi o atendimento? Avalie:</div>'+'<div class="stars" style="font-size:22px;cursor:pointer;letter-spacing:6px" data-id="'+t.ticket_id+'" onclick="rate(this)">★★★★★</div>'+'<textarea id="rateC-'+t.ticket_id+'" placeholder="Comentario (opcional)" style="width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid rgba(49,58,65,.5);background:rgba(22,26,30,.6);color:#e4e8ea;font-size:12px;resize:vertical"></textarea>'+'<div style="font-size:10px;color:#a5adb3;margin-top:4px">Clique nas estrelas para avaliar (1 a 5).</div></div>';}else if(t.rating){h+='<div style="margin-top:8px;font-size:12px;color:#facc15">Sua avaliacao: '+"★".repeat(t.rating)+"</div>";if(t.rating_comment)h+='<div class="ticket-dates">'+t.rating_comment+'</div>';}h+="</div>"});el.innerHTML=h;window.curEmail=email}).catch(function(){alert("Erro ao buscar")}).finally(function(){btn.disabled=false;btn.textContent="Buscar Chamados"})}function showSearch(){document.getElementById("searchCard").style.display="block";document.getElementById("resultsCard").style.display="none"}function rate(el){var ev=window.event;var tid=parseInt(el.getAttribute("data-id"),10);var w=el.offsetWidth||100;var x=(ev&&ev.offsetX)?ev.offsetX:0;var n=Math.max(1,Math.min(5,Math.floor(x/(w/5))+1));var c=document.getElementById("rateC-"+tid);var comment=c?c.value.trim():"";if(!window.curEmail){alert("Email nao identificado");return}fetch("/api/tickets/rate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ticket_id:tid,email:window.curEmail,rating:n,comment:comment})}).then(function(r){return r.json()}).then(function(d){if(d.ok){var box=document.getElementById("rate-"+tid);if(box){box.innerHTML="<div style=font-size:13px;color:#22c55e>Obrigado! Avaliacao registrada ("+n+"/5) 🙏</div>"}else{alert("Obrigado pela avaliacao!")}}else{alert(d.error||"Erro")}}).catch(function(){alert("Erro de conexao")})}</script></body></html>
